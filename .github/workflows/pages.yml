name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "*.yaml", "*.sh", "*.conf", "Dockerfile", "Jenkinsfile", "train.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/files
          cp site/index.html _site/
          cp pytorch-gpu-deployment.yaml pytorch-distributed-job.yaml pytorch_job.sh slurm.conf gres.conf Dockerfile Jenkinsfile train.py _site/files/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
